
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OUMI TECH - Scanner WiFi</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #07111f;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 { color: #36d6c4; }
    p { color: #cbd5e1; }

    button {
      background: #36d6c4;
      color: #07111f;
      border: 0;
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      margin: 8px;
      cursor: pointer;
    }

    #camera {
      width: 100%;
      max-width: 420px;
      border-radius: 12px;
      background: #000;
    }

    #status {
      overflow-wrap: anywhere;
      margin: 15px 0;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      max-width: 420px;
      padding: 12px;
      border-radius: 8px;
      margin: 8px 0;
    }

    #send {
      display: none;
    }
  </style>
</head>

<body>
  <h1>OUMI TECH</h1>
  <p>Scanner un ticket Wi-Fi</p>

  <video id="camera" autoplay playsinline muted></video>

  <div>
    <button id="start" type="button">Démarrer la caméra</button>
    <button id="stop" type="button">Arrêter</button>
  </div>

  <p id="status">Appuyez sur « Démarrer la caméra ».</p>

  <label for="code">Code du ticket détecté :</label><br>
  <input id="code" type="text"
         placeholder="Le code apparaîtra ici"
         autocomplete="off">

  <div>
    <button id="send" type="button">
      Transmettre au portail
    </button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <script>
    const video = document.getElementById("camera");
    const statusText = document.getElementById("status");
    const codeInput = document.getElementById("code");
    const sendButton = document.getElementById("send");

    let stream = null;
    let timer = null;
    let lastCode = "";

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d", {
      willReadFrequently: true
    });

    document.getElementById("start").addEventListener("click", async () => {
      try {
        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {
          throw new Error(
            "Caméra indisponible. Ouvrez cette page en HTTPS dans Chrome."
          );
        }

        stopCamera();

        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false
        });

        video.srcObject = stream;
        await video.play();

        statusText.textContent =
          "Caméra active. Présentez le QR code devant l’objectif.";

        timer = setInterval(scanFrame, 250);

      } catch (error) {
        statusText.textContent =
          "Impossible d’ouvrir la caméra : " + error.message;
      }
    });

    function scanFrame() {
      if (!stream || video.readyState !== video.HAVE_ENOUGH_DATA) {
        return;
      }

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const image = ctx.getImageData(
        0, 0, canvas.width, canvas.height
      );

      if (typeof jsQR !== "function") {
        statusText.textContent =
          "Le lecteur QR n’a pas pu être chargé. Vérifiez Internet.";
        return;
      }

      const result = jsQR(
        image.data,
        image.width,
        image.height
      );

      if (result && result.data) {
        const detectedCode = result.data.trim();

        if (!detectedCode || detectedCode.length > 100) {
          statusText.textContent =
            "Code QR invalide ou trop long.";
          return;
        }

        lastCode = detectedCode;
        codeInput.value = detectedCode;
        sendButton.style.display = "inline-block";

        statusText.textContent =
          "QR détecté. Appuyez sur « Transmettre au portail ».";

        stopCamera();
      }
    }

    function stopCamera() {
      if (timer !== null) {
        clearInterval(timer);
        timer = null;
      }

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      video.srcObject = null;
    }

    document.getElementById("stop").addEventListener("click", () => {
      stopCamera();
      statusText.textContent = "Caméra arrêtée.";
    });

    sendButton.addEventListener("click", () => {
      const code = lastCode.trim();

      if (!code || code.length > 100) {
        statusText.textContent = "Aucun code QR valide à transmettre.";
        return;
      }

      if (!window.opener || window.opener.closed) {
        statusText.textContent =
          "Le portail n’a pas été retrouvé. Ouvrez le scanner depuis le portail.";
        return;
      }

      window.opener.postMessage(
        {
          type: "OUMI_QR_TICKET",
          code: code
        },
        "http://wifi.zone"
      );

      statusText.textContent =
        "Code transmis. Revenez à la page du portail pour vérifier les champs.";
    });
  </script>
</body>
</html>
