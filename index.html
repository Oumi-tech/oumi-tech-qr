<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OUMI TECH - Scanner QR Wi-Fi</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: #07111f;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 { color: #36d6c4; }
    p { color: #cbd5e1; }

    button {
      background: #36d6c4;
      color: #07111f;
      border: 0;
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      margin: 8px 4px;
      cursor: pointer;
    }

    #camera {
      width: 100%;
      max-width: 420px;
      background: #000;
      border-radius: 12px;
    }

    #status {
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    #code {
      width: 100%;
      max-width: 420px;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
    }

    #send { display: none; }
  </style>
</head>

<body>
  <h1>OUMI TECH</h1>
  <p>Scanner un ticket Wi-Fi</p>

  <video id="camera" autoplay playsinline muted></video>

  <div>
    <button id="start" type="button">Démarrer la caméra</button>
    <button id="stop" type="button">Arrêter</button>
  </div>

  <p id="status" role="status">
    Appuyez sur « Démarrer la caméra ».
  </p>

  <label for="code">Code du ticket détecté :</label>
  <p>
    <input id="code" type="text"
           placeholder="Le code apparaîtra ici"
           autocomplete="off">
  </p>

  <button id="send" type="button">Transmettre au portail</button>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <script>
    const video = document.getElementById("camera");
    const statusText = document.getElementById("status");
    const codeInput = document.getElementById("code");
    const sendButton = document.getElementById("send");

    let stream = null;
    let timer = null;
    let lastCode = "";

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d", {
      willReadFrequently: true
    });

    function stopCamera() {
      if (timer !== null) {
        clearInterval(timer);
        timer = null;
      }

      if (stream !== null) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      video.srcObject = null;
    }

    async function startCamera() {
      stopCamera();

      if (!window.isSecureContext) {
        statusText.textContent =
          "Erreur : ouvrez le scanner avec son adresse HTTPS dans Chrome.";
        return;
      }

      if (!navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia) {
        statusText.textContent =
          "Caméra indisponible dans ce navigateur. Ouvrez le site HTTPS dans Chrome.";
        return;
      }

      try {
        statusText.textContent = "Demande d’accès à la caméra…";

        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" }
          },
          audio: false
        });

        video.srcObject = stream;
        await video.play();

        statusText.textContent =
          "Caméra active. Présentez le QR code devant l’objectif.";

        timer = setInterval(scanFrame, 300);

      } catch (error) {
        let message = error.name || "Erreur inconnue";

        if (error.name === "NotAllowedError" ||
            error.name === "PermissionDeniedError") {
          message =
            "Accès refusé : autorisez la caméra pour ce site dans Chrome, puis rechargez la page.";
        } else if (error.name === "NotFoundError") {
          message = "Aucune caméra détectée.";
        } else if (error.name === "NotReadableError") {
          message =
            "La caméra est peut-être utilisée par une autre application. Fermez-la puis réessayez.";
        } else {
          message = "Erreur caméra : " + error.name +
                    (error.message ? " — " + error.message : "");
        }

        statusText.textContent = message;
        stopCamera();
      }
    }

    function scanFrame() {
      if (!stream ||
          video.readyState !== video.HAVE_ENOUGH_DATA) {
        return;
      }

      if (typeof window.jsQR !== "function") {
        statusText.textContent =
          "Lecteur QR non chargé. Vérifiez la connexion Internet.";
        return;
      }

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      if (!canvas.width || !canvas.height) return;

      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const image = ctx.getImageData(
        0, 0, canvas.width, canvas.height
      );

      const result = window.jsQR(
        image.data, image.width, image.height
      );

      if (!result || !result.data) return;

      const detectedCode = result.data.trim();

      if (!detectedCode || detectedCode.length > 100) {
        statusText.textContent = "QR invalide ou trop long.";
        return;
      }

      lastCode = detectedCode;
      codeInput.value = detectedCode;
      sendButton.style.display = "inline-block";

      statusText.textContent =
        "QR détecté. Appuyez sur « Transmettre au portail ».";

      stopCamera();
    }

    document.getElementById("start")
      .addEventListener("click", startCamera);

    document.getElementById("stop")
      .addEventListener("click", () => {
        stopCamera();
        statusText.textContent = "Caméra arrêtée.";
      });

    sendButton.addEventListener("click", () => {
      const code = codeInput.value.trim();

      if (!code || code.length > 100) {
        statusText.textContent = "Code invalide.";
        return;
      }

      if (!window.opener || window.opener.closed) {
        statusText.textContent =
          "Portail introuvable. Ouvrez le scanner depuis le portail captif.";
        return;
      }

      window.opener.postMessage(
        { type: "OUMI_QR_TICKET", code: code },
        "http://wifi.zone"
      );

      statusText.textContent =
        "Code transmis. Revenez au portail captif.";
    });
  </script>
</body>
</html>
